# Shared settings for all six nodes.
# Per-node values (announce IP, password) are passed on the command line in docker-compose.yml.

# Listen on every interface inside the container. The password (set on the command line)
# is what keeps this safe; the Docker network keeps it private.
bind 0.0.0.0
port 6379

# --- Cluster mode ---------------------------------------------------------------
cluster-enabled yes
cluster-config-file nodes.conf

# How long a node may be unreachable before the others suspect it (milliseconds).
# Failover takes roughly this long plus the election time. Lower = faster failover,
# but more false alarms on a slow network.
cluster-node-timeout 5000

# "no": if one shard loses all its nodes, the other shards keep serving their slots.
# "yes" (default): the whole cluster stops accepting writes until every slot is covered.
cluster-require-full-coverage no

# --- Durability -----------------------------------------------------------------
# Append-only file: replay writes after a restart. fsync once per second means we can
# lose up to ~1 second of writes on a crash.
appendonly yes
appendfsync everysec

# --- Memory ---------------------------------------------------------------------
# Cap memory and, when full, evict only keys that have a TTL (cache entries),
# never keys without one (counters, sessions without expiry, and so on).
maxmemory 128mb
maxmemory-policy volatile-lru

# --- Networking -----------------------------------------------------------------
# Send TCP keepalives so half-dead connections are noticed.
tcp-keepalive 60
