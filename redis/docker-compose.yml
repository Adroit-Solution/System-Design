x-redis-common: &redis-common
  image: redis:7.2-alpine
  restart: unless-stopped

services:
  redis-node-1:
    <<: *redis-common
    container_name: redis-node-1
    command: >
      redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname
    ports: ["7001:7001"]
    networks: { redis-net: { ipv4_address: 172.30.0.11 } }

  redis-node-2:
    <<: *redis-common
    container_name: redis-node-2
    command: >
      redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname
    ports: ["7002:7002"]
    networks: { redis-net: { ipv4_address: 172.30.0.12 } }

  redis-node-3:
    <<: *redis-common
    container_name: redis-node-3
    command: >
      redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname
    ports: ["7003:7003"]
    networks: { redis-net: { ipv4_address: 172.30.0.13 } }

  redis-node-4:
    <<: *redis-common
    container_name: redis-node-4
    command: >
      redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname
    ports: ["7004:7004"]
    networks: { redis-net: { ipv4_address: 172.30.0.14 } }

  redis-node-5:
    <<: *redis-common
    container_name: redis-node-5
    command: >
      redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname
    ports: ["7005:7005"]
    networks: { redis-net: { ipv4_address: 172.30.0.15 } }

  redis-node-6:
    <<: *redis-common
    container_name: redis-node-6
    command: >
      redis-server --port 7006 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname
    ports: ["7006:7006"]
    networks: { redis-net: { ipv4_address: 172.30.0.16 } }

  redis-cluster-init:
    image: redis:7.2-alpine
    container_name: redis-cluster-init
    depends_on: [redis-node-1, redis-node-2, redis-node-3, redis-node-4, redis-node-5, redis-node-6]
    restart: "no"
    networks: [redis-net]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        sleep 5 &&
        redis-cli --cluster create
        172.30.0.11:7001 172.30.0.12:7002 172.30.0.13:7003
        172.30.0.14:7004 172.30.0.15:7005 172.30.0.16:7006
        --cluster-replicas 1 --cluster-yes

networks:
  redis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24